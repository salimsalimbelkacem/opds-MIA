name: Build and Deploy OPDS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rebuild weekly on Monday at 06:00 UTC to pick up new ebooks
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          # install from requirements.txt if it exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install . 2>/dev/null || true; fi

      - name: Generate OPDS catalog
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          echo "Building with BASE_URL=$BASE_URL"
          python generate.py
          # Disable Jekyll so _* files and .xml are served as-is
          touch opds/.nojekyll
          echo "Generated files:"
          ls -lh opds/
          echo "--- index.xml preview (first 30 lines) ---"
          head -n 30 opds/index.xml || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./opds

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
